name: Publish 25 demo websites

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Get repository files
        uses: actions/checkout@v6
      - name: Unpack the prepared websites
        run: |
          python -m zipfile -e github-pages-ready.zip _site
          test -f _site/index.html
          test "$(find _site/sites -name index.html | wc -l)" -eq 25
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload the websites
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
